<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Market Analytics</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/home.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h1>Stock Market Analytics & Prediction</h1>

      <!-- Stock Ticker Section -->
      <div class="section ticker-section">
        <h2>Live Stock Prices</h2>
        <div class="ticker-wrap">
          <div id="stockTicker" class="ticker"></div>
        </div>
      </div>

      <!-- Stock Prediction Section -->
      <div class="section prediction">
        <h2>Predict Stock Price</h2>
        <form id="predictionForm">
          <div class="form-group">
            <label for="stock">Select Stock</label>
            <select id="stock" name="stock" required>
              <option value="GEN">General</option>
              <option value="AAPL">Apple Inc. (AAPL)</option>
              <option value="GOOGL">Alphabet Inc. (GOOGL)</option>
              <option value="AMZN">Amazon.com Inc. (AMZN)</option>
              <option value="MSFT">Microsoft Corporation (MSFT)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="Open">Opening Price</label>
            <input type="number" step="0.01" id="Open" name="Open" required />
          </div>

          <div class="form-group">
            <label for="High">Highest Price</label>
            <input type="number" step="0.01" id="High" name="High" required />
          </div>

          <div class="form-group">
            <label for="Low">Lowest Price</label>
            <input type="number" step="0.01" id="Low" name="Low" required />
          </div>

          <div class="form-group">
            <label for="Volume">Trading Volume</label>
            <input type="number" id="Volume" name="Volume" required />
          </div>

          <button type="submit" class="predict-btn">Predict Price</button>
        </form>
        <div id="predictionResult" class="prediction-result"></div>
      </div>
    </div>
    <script src="{{ url_for('static', filename='js/home.js') }}"></script>
  </body>
</html>
